[project]
name = "wildpatch"
version = "0.1.0"
description = "Rewild any patch of land with open biodiversity data and open-weight AI, routed through Otari"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.10.23",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

asyncio_default_fixture_loop_scope = "function"
